name: __APP_NAME__-dev
services:
  postgres:
    image: postgres:17-bookworm
    container_name: ${DEV_POSTGRES_CONTAINER_NAME:-__APP_NAME__-PostgreSQL-dev}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PGUSER:?请设置 dev.env 中的 PGUSER}
      POSTGRES_DB: ${PGDATABASE:?请设置 dev.env 中的 PGDATABASE}
      POSTGRES_PASSWORD: ${PGPASSWORD:?请设置 dev.env 中的 PGPASSWORD}
    volumes:
      - "${DEV_POSTGRES_DATA_PATH:-./data/postgres-dev}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    stop_grace_period: 60s
